name: 构建发布版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 v0.1.1）'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build:
    name: 编译验证（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成 scbb_config.h（启用可移植模块）
        run: python scripts/gen_config_header.py scripts/release.config scbb_config.h

      - name: 配置 CMake
        shell: bash
        run: |
          INC="-I${GITHUB_WORKSPACE}/BSP/Ai-M6x/gpio -I${GITHUB_WORKSPACE}/BSP/Ai-M6x/i2c -I${GITHUB_WORKSPACE}/BSP/Ai-M6x/spi -I${GITHUB_WORKSPACE}/BSP/Ai-M6x/uart -I${GITHUB_WORKSPACE}/BSP/Ai-M6x/delay"
          cmake -S . -B build \
            -DSCBB_CONFIG_HEADER_PATH=scbb_config.h \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_FLAGS=${INC}"

      - name: 编译
        run: cmake --build build --config Release

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包源码
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ARCHIVE_REF="HEAD"
          if git rev-parse -q --verify "$TAG" >/dev/null 2>&1; then
            ARCHIVE_REF="$TAG"
          fi
          git archive --format=tar.gz \
            --prefix="${TAG}/" \
            -o "${TAG}.tar.gz" "$ARCHIVE_REF"

      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG"
            gh release upload "$TAG" "${TAG}.tar.gz" --clobber
          else
            gh release create "$TAG" "${TAG}.tar.gz" \
              --title "$TAG" \
              --generate-notes
          fi
